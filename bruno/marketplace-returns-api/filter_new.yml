info:
  name: filter_new
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/returns?status=NEW"
  auth: inherit
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
